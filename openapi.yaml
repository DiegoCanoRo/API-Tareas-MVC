openapi: 3.0.0
info:
  title: API de Tareas
  version: 1.0.0
  description: API para gestión de tareas, personas y tags con autenticación
servers:
  - url: http://localhost:3000
paths:
  /api/auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  message:
                    type: string
        '401':
          description: Credenciales inválidas
  /api/auth/logout:
    post:
      summary: Cerrar sesión
      responses:
        '200':
          description: Logout exitoso
  /api/personas:
    post:
      summary: Registrar nueva persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaInput'
      responses:
        '201':
          description: Persona creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          description: Datos inválidos
  /api/personas/{id}:
    put:
      summary: Modificar persona completa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaInput'
      responses:
        '200':
          description: Persona modificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: Persona no encontrada
    patch:
      summary: Desactivar persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Persona desactivada
    patch:
      summary: Activar persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Persona activada
    delete:
      summary: Eliminar persona físicamente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Persona eliminada
        '404':
          description: Persona no encontrada
  /api/tareas:
    get:
      summary: Obtener todas las tareas
      responses:
        '200':
          description: Lista de tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarea'
    post:
      summary: Crear nueva tarea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TareaInput'
      responses:
        '201':
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '400':
          description: Datos inválidos
  /api/tareas/buscar:
    get:
      summary: Buscar tareas por título
      parameters:
        - name: titulo
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de tareas encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarea'
  /api/tareas/persona/{personaId}:
    get:
      summary: Obtener tareas por persona
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de tareas de la persona
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarea'
  /api/tareas/tag/{tagId}:
    get:
      summary: Obtener tareas por tag
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de tareas con el tag
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarea'
  /api/tareas/personas-por-tag/{tagId}:
    get:
      summary: Obtener personas por tag
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de personas asociadas al tag
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Persona'
  /api/tareas/vincular-tag:
    post:
      summary: Vincular tag a tarea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tareaId:
                  type: integer
                tagId:
                  type: integer
              required:
                - tareaId
                - tagId
      responses:
        '200':
          description: Tag vinculado a tarea
        '400':
          description: Datos inválidos
  /api/tareas/{id}:
    get:
      summary: Obtener tarea por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tarea encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '404':
          description: Tarea no encontrada
    put:
      summary: Actualizar tarea completa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TareaInput'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '404':
          description: Tarea no encontrada
    patch:
      summary: Actualizar tarea parcialmente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TareaInput'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '404':
          description: Tarea no encontrada
    delete:
      summary: Eliminar tarea
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tarea eliminada
        '404':
          description: Tarea no encontrada
components:
  schemas:
    Persona:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
        activo:
          type: boolean
      required:
        - id
        - nombre
        - apellido
        - email
        - activo
    PersonaInput:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
        activo:
          type: boolean
      required:
        - nombre
        - apellido
        - email
    Tarea:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
        categoria:
          type: string
        completada:
          type: boolean
        personaId:
          type: integer
      required:
        - id
        - titulo
        - descripcion
        - categoria
        - completada
        - personaId
    TareaInput:
      type: object
      properties:
        titulo:
          type: string
        descripcion:
          type: string
        categoria:
          type: string
        completada:
          type: boolean
        personaId:
          type: integer
      required:
        - titulo
        - descripcion
        - categoria
        - completada
        - personaId
    Tag:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
      required:
        - id
        - nombre